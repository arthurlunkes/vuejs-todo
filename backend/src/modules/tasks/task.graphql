type Task {
  id: ID!
  title: String!
  description: String
  done: Boolean
  createdAt: String
  updatedAt: String
  deletedAt: String
}

type Query {
  tasks: [Task]
  task(id: ID!): Task
}

type Mutation {
  createTask(title: String!, description: String): Task
  updateTask(id: ID!, title: String, description: String, done: Boolean): Task
  deleteTask(id: ID!): Boolean
}
